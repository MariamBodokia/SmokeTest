name: Build, deploy, and smoke test

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "smokemonitor/**"
      - "smoke-tests/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: smokemonitor-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover Terraform-managed resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          resource_group=$(az group list \
            --tag project=smokemonitor \
            --query "[?tags.environment=='poc'].name | [0]" \
            --output tsv)
          registry=$(az acr list \
            --resource-group "$resource_group" \
            --query "[0].{name:name,loginServer:loginServer}" \
            --output json)
          echo "resource_group=$resource_group" >> "$GITHUB_OUTPUT"
          echo "registry_name=$(jq -r .name <<< "$registry")" >> "$GITHUB_OUTPUT"
          echo "registry_server=$(jq -r .loginServer <<< "$registry")" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ steps.resources.outputs.registry_name }}"

      - name: Build and push application image
        run: |
          image="${{ steps.resources.outputs.registry_server }}/smokemonitor-demo:${GITHUB_SHA}"
          docker build --tag "$image" app
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build and push SmokeMonitor image
        run: |
          image="${{ steps.resources.outputs.registry_server }}/smokemonitor:${GITHUB_SHA}"
          docker build --tag "$image" smokemonitor
          docker push "$image"
          echo "MONITOR_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "${{ steps.resources.outputs.resource_group }}" \
            --image "$IMAGE"
          az containerapp update \
            --name smokemonitor-monitor \
            --resource-group "${{ steps.resources.outputs.resource_group }}" \
            --image "$MONITOR_IMAGE"

      - name: Read application URL
        id: app
        run: |
          url=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "${{ steps.resources.outputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "url=https://$url" >> "$GITHUB_OUTPUT"

      - name: Read SmokeMonitor URL
        id: monitor
        run: |
          url=$(az containerapp show \
            --name smokemonitor-monitor \
            --resource-group "${{ steps.resources.outputs.resource_group }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "url=https://$url" >> "$GITHUB_OUTPUT"

      - name: Install Playwright test dependencies
        run: |
          python -m pip install -r smoke-tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.app.outputs.url }}
        run: |
          mkdir -p artifacts
          pytest smoke-tests --junitxml=artifacts/junit.xml

      - name: Publish run to SmokeMonitor
        if: always() && steps.smoke.outcome != 'skipped' && secrets.SMOKEMONITOR_TOKEN != ''
        env:
          MONITOR_URL: ${{ steps.monitor.outputs.url }}
          MONITOR_TOKEN: ${{ secrets.SMOKEMONITOR_TOKEN }}
          BASE_URL: ${{ steps.app.outputs.url }}
          RUN_STATUS: ${{ steps.smoke.outcome == 'success' && 'SUCCESS' || 'FAILURE' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from xml.etree import ElementTree

          xml = open("artifacts/junit.xml", encoding="utf-8").read()
          root = ElementTree.fromstring(xml)
          suites = [root] if root.tag == "testsuite" else list(root.findall(".//testsuite"))
          failed = []
          for case in root.findall(".//testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is not None:
                  failed.append({
                      "name": case.attrib.get("name", "unknown"),
                      "classname": case.attrib.get("classname", ""),
                      "message": failure.attrib.get("message", failure.text or ""),
                  })
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          payload = {
              "job": os.environ.get("GITHUB_WORKFLOW", "github-actions-smoke"),
              "build": os.environ.get("GITHUB_RUN_NUMBER", os.environ["GITHUB_SHA"][:8]),
              "status": os.environ["RUN_STATUS"],
              "attempt": 1,
              "base_url": os.environ["BASE_URL"],
              "build_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "total": total,
              "failed": len(failed),
              "skipped": skipped,
              "passed": max(0, total - len(failed) - skipped),
              "failed_tests": failed,
          }
          request = urllib.request.Request(
              os.environ["MONITOR_URL"] + "/api/results",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "X-SmokeMonitor-Token": os.environ["MONITOR_TOKEN"]},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              print(response.read().decode())
          PY

      - name: Check SmokeMonitor
        run: curl --fail --silent "${{ steps.monitor.outputs.url }}/health"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: artifacts/
          if-no-files-found: ignore
